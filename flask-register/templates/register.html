<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
    <h1>Sport Registration</h1>
    <form action="/register" method="POST">
        <input autocomplete="off" autofocus name="name" placeholder="Enter your name" type="text" required>
        <select name="sport">
            <option disabled selected value="">Select Sport</option>
            {% for sport in sports %}
                <option value="{{ sport }}">{{ sport }}</option>
            {% endfor %}
        </select>
        <input type="submit" value="Register">
    </form>
</body>
</html>
